services:
  db:
    image: "${DB_IMAGE:-mariadb:10.6}"
    container_name: "${AIPS_DB_CONTAINER:-wp-ai-scheduler-db}"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-wordpress}"
      MYSQL_USER: "${MYSQL_USER:-wordpress}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-wordpress}"
    volumes:
      # Use a named Docker volume for database persistence
      - db_data_v2:/var/lib/mysql
      # Mount custom MariaDB configuration to reduce log sizes and tmp usage
      - ./mariadb-conf/my.cnf:/etc/mysql/conf.d/my_custom.cnf:ro
    ports:
      # Expose MySQL port for external database tools (e.g., MySQL Workbench, TablePlus)
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      # Official MariaDB image helper; avoids passing the root password on the command line.
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - wp-network

  web:
    build:
      context: .
      args:
        WP_IMAGE_TAG: "${WP_IMAGE_TAG:-7.1-php8.3-apache}"
        XDEBUG_VERSION: "${XDEBUG_VERSION:-3.4.0}"
    container_name: "${AIPS_WEB_CONTAINER:-wp-ai-scheduler-web}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"        # WordPress site
      - "${XDEBUG_PORT:-9003}:9003"  # Xdebug
    environment:
      # WordPress DB settings used by entrypoint WP-CLI commands
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: "${MYSQL_DATABASE:-wordpress}"
      WORDPRESS_DB_USER: "${MYSQL_USER:-wordpress}"
      WORDPRESS_DB_PASSWORD: "${MYSQL_PASSWORD:-wordpress}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root}"

      # WordPress core source: "image" (bundled with the image, default) or
      # "trunk" (git clone of WordPress trunk on first boot).
      WP_CORE_SOURCE: "${WP_CORE_SOURCE:-image}"
      WP_TABLE_PREFIX: "${WP_TABLE_PREFIX:-wp_}"
      PHPMYADMIN_PORT: "${PHPMYADMIN_PORT:-8082}"

      # Initial WP admin credentials (change as needed)
      WP_ADMIN_USER: "${WP_ADMIN_USER:-admin}"
      WP_ADMIN_PASSWORD: "${WP_ADMIN_PASSWORD:-admin}"
      WP_ADMIN_EMAIL: "${WP_ADMIN_EMAIL:-admin@example.com}"
      WP_SITE_TITLE: "${WP_SITE_TITLE:-WP AI Scheduler Dev}"
      WP_SITE_URL: "http://localhost:${WP_PORT:-8080}"

      # Enable entrypoint debug output
      ENTRYPOINT_DEBUG: "1"
      
      # AI Connector Configuration
      AIPS_AI_PROVIDER: "${AIPS_AI_PROVIDER:-wp_ai_client}"
      DEFAULT_AI_CONNECTOR_PLUGIN: "${DEFAULT_AI_CONNECTOR_PLUGIN:-ai-provider-for-google}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"


      # PHP Configuration
      PHP_IDE_CONFIG: "serverName=localhost"

      # Xdebug (off by default; see .env.example for details).
      # docker-entrypoint.sh reads these and generates
      # /usr/local/etc/php/conf.d/zz-xdebug-runtime.ini at container start.
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      XDEBUG_START_WITH_REQUEST: "${XDEBUG_START_WITH_REQUEST:-trigger}"
      XDEBUG_CLIENT_HOST: "${XDEBUG_CLIENT_HOST:-host.docker.internal}"
      XDEBUG_CLIENT_PORT: "${XDEBUG_CLIENT_PORT:-9003}"
      XDEBUG_IDEKEY: "${XDEBUG_IDEKEY:-PHPSTORM}"
      XDEBUG_LOG: "${XDEBUG_LOG:-/tmp/xdebug.log}"
      XDEBUG_LOG_LEVEL: "${XDEBUG_LOG_LEVEL:-7}"

    volumes:
      # Use a named Docker volume for WordPress core files
      - wordpress_data_v2:/var/www/html

      # Bind-mount development PHP/Xdebug settings so they can be edited
      # locally and applied with an Apache reload instead of a rebuild.
      - ./dev-php.ini:/usr/local/etc/php/conf.d/zz-dev-php.ini:ro

      # CRITICAL: Mount plugin source for live development
      # This allows you to edit files in your local ai-post-scheduler directory
      # and see changes immediately without rebuilding the container
      - ./ai-post-scheduler:/var/www/html/wp-content/plugins/ai-post-scheduler:rw
      
      # Optional: Mount uploads directory for persistence
      - uploads_data:/var/www/html/wp-content/uploads
      
      # Optional: Mount themes for development (uncomment if needed)
      # - ./my-theme:/var/www/html/wp-content/themes/my-theme:rw
    networks:
      - wp-network
    extra_hosts:
      # Allow container to reach host machine (needed for Xdebug)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  phpmyadmin:
    image: "${PMA_IMAGE:-phpmyadmin/phpmyadmin:latest}"
    container_name: "${AIPS_PMA_CONTAINER:-wp-ai-scheduler-phpmyadmin}"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PHPMYADMIN_PORT:-8082}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
      PMA_USER: "${MYSQL_USER:-wordpress}"
      PMA_PASSWORD: "${MYSQL_PASSWORD:-wordpress}"
    networks:
      - wp-network

# Define networks
networks:
  wp-network:
    driver: bridge

# Declare the named volumes
volumes:
  db_data_v2:
  wordpress_data_v2:
  uploads_data: